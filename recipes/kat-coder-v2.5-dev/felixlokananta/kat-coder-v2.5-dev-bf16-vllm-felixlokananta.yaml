recipe_version: "2"
# KAT-Coder-V2.5-Dev — BF16 upstream weights, single DGX Spark node.
# Reference-quality tier. ~69 GB of weights on a 128 GB Spark, so this is the
# tight one: gpu_memory_utilization is pushed to 0.85 (~109 GB) and the batch
# is kept small. Use the NVFP4 or FP8 recipe unless you specifically need the
# unquantized reference.
model: Kwaipilot/KAT-Coder-V2.5-Dev
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

min_nodes: 1
max_nodes: 1

metadata:
  description: "KAT-Coder-V2.5-Dev BF16 — Kwaipilot 35B/3B-active agentic coding MoE, upstream weights, 256K context, single node."
  maintainer: "felixlokananta"
  category: agent
  model_params: 35B
  model_dtype: bf16
  kv_dtype: fp8
  # 40 decoder layers, full attention every 4th layer → 10 KV-cached layers.
  num_layers: 10
  num_kv_heads: 2
  head_dim: 256

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  max_num_batched_tokens: 8192
  max_num_seqs: 8
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  load_format: fastsafetensors
  served_model_name: kat-coder-v2.5-dev
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  default_chat_template_kwargs: '{"preserve_thinking":true}'

env:
  FLASHINFER_DISABLE_VERSION_CHECK: "1"

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      -tp {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --load-format {load_format} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-auto-tool-choice \
      --tool-call-parser {tool_call_parser} \
      --reasoning-parser {reasoning_parser} \
      --default-chat-template-kwargs '{default_chat_template_kwargs}' \
      --language-model-only

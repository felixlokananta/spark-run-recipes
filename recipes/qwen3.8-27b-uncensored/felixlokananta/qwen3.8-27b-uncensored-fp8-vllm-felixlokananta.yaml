recipe_version: "2"
# Qwen3.8-27B-Uncensored — orcarouter's abliterated Qwen3.8-27B in block-FP8,
# single DGX Spark node, with MTP speculative decoding turned up aggressively.
#
# Same architecture as the stock qwen3.8-27b recipes: dense 27B hybrid VLM, 64
# decoder layers of which every 4th is full attention and the other 48 are Gated
# DeltaNet. ~30.9 GB of weights in 7 shards. The refusal direction is
# orthogonalized out of 131 residual-writing matrices; the vision tower and the
# MTP draft head are copied through untouched.
#
# NOTE: the source repo is gated (auto-approve). Accept the terms on the model
# page and have HF_TOKEN in the sparkrun host environment before running —
# recipe `env:` values are NOT interpolated from the host. See the README.
model: orcarouter/Qwen3.8-27B-Uncensored-FP8
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

min_nodes: 1
max_nodes: 1

metadata:
  description: "Qwen3.8-27B-Uncensored FP8 — abliterated dense 27B hybrid-attention VLM, 262K context, aggressive MTP speculative decoding, single node."
  maintainer: "felixlokananta"
  category: general
  model_params: 27B
  model_dtype: fp8
  quantization: fp8
  quant_bits: 8
  kv_dtype: fp8
  # 16 of the 64 decoder layers are full attention; the rest are Gated DeltaNet
  # and hold a recurrent state instead of KV pages. See the README.
  num_layers: 16
  num_kv_heads: 4
  head_dim: 256

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # 0.75 yields 54.13 GiB of KV = 1,448,168 tokens = 5.52x concurrency at full
  # context. An earlier PIECEWISE run reported 69.72 GiB / 7.12x, but that came
  # off a broken profile (it printed "peak activation -10.19 GiB" and "estimated
  # CUDA graph memory -12.07 GiB") and left the card at 99.4% occupied. With
  # full graphs the profiler returns sane numbers and this sits at ~89%.
  # Headroom remains: startup offers --kv-cache-memory=71493633536 (66.58 GiB,
  # ~6.8x) to fully utilise, and the graph estimator overshoots actual pool
  # memory by 1.8 GiB (0.4 actual vs 2.19 estimated) which util 0.768 reclaims.
  # Untouched so far because every benchmark here ran at 4.5% KV usage.
  gpu_memory_utilization: 0.75
  max_model_len: 262144
  max_num_batched_tokens: 8192
  # Each concurrent sequence pins ~151 MB of fp32 Gated DeltaNet state on top of
  # its KV pages. Aggregate throughput is still climbing at 8 (6.0x the c1 rate)
  # and per-request throughput only sags 9%, so 8 is not a throughput ceiling —
  # TTFT is what degrades, see the sweep under speculative_config below.
  max_num_seqs: 8
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  # 7 shards, largest 4.97 GB, ~36 GB bounce-buffer peak — well under the
  # ceiling that forced the KAT-Coder FP8 recipe to drop this flag.
  load_format: fastsafetensors
  served_model_name: qwen3.8-27b-uncensored
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  default_chat_template_kwargs: '{"reasoning_effort":"medium"}'
  limit_mm_per_prompt: '{"image":4,"video":1}'
  # MTP at a flat depth of 6. A per-batch-size ladder used to live here
  # ([[1,2,6],[3,4,4],[5,6,3],[7,8,2]]) and was removed: a ladder varies the
  # verify length at runtime, so vLLM downgrades cudagraph_mode
  # FULL_AND_PIECEWISE -> PIECEWISE and decode loses full CUDA graphs. A flat
  # depth keeps the shape static; startup then reports
  # "Capturing CUDA graphs (decode, FULL): 8/8", largest=56 = 8 seqs x 7 tokens.
  #
  # Measured, llama-benchy pp2048/tg512/c2, correct tokenizer, 3 runs each:
  #
  #                        t/s    accept len   steps/s   eff. bandwidth
  #   ladder / PIECEWISE   26.85     3.018       4.45     148 GB/s (54.4%)
  #   flat 6 / FULL        30.34     3.211       4.73     158 GB/s (57.8%)
  #
  # The +13% headline is only half real. Acceptance happened to come out 6.4%
  # higher on the second run (content luck — llama-benchy samples random corpus
  # offsets); the step rate, which is what full graphs actually buy, went up
  # 6.2%. ALWAYS normalise throughput by measured acceptance length before
  # comparing runs, or the content draw swamps the effect being measured.
  #
  # 6.2% and not more because only the verify pass is captured. The six draft
  # iterations still run eagle_prepare_inputs_padded_kernel and
  # eagle_step_slot_mapping_metadata_kernel between steps, outside the graph.
  # 57.8% of Spark's 273 GB/s says there is overhead still on the table.
  #
  # DEPTH. The head is one decoder layer (mtp_num_hidden_layers: 1) reused
  # autoregressively, so each extra draft token re-reads ~0.4 GB against the
  # ~31 GB the verify pass reads — ~2.4% for the last two tokens. Pooled over
  # both runs above: 6987 accepted of 19,680 drafted across 3280 steps,
  # 35.5% acceptance, mean acceptance length 3.13.
  #
  #   pos      1      2      3      4      5      6
  #   rate  .724   .503   .342   .249   .185   .131
  #   cum   1.72   2.23   2.57   2.82   3.00   3.13
  #
  # Positions 5-6 are worth 0.315 tokens/step: cutting to 4 costs 10.1% to save
  # ~2.4%. Depth 8 extrapolates (decay ratio .707) to +5.1% for +2.4% — but see
  # the noise floor before trying to measure that.
  #
  # NOISE FLOOR. Acceptance varies ~6% run to run and swings 1.85-4.83 window to
  # window, because it decays *within* a generation (~4.3 just after prefill,
  # ~2.1 by token 512) and depends on the text. Three runs of llama-benchy
  # cannot resolve anything below ~7% unless normalised by acceptance length.
  # A tg128 benchmark only samples the high-acceptance opening and reads ~3.7.
  #
  # CONCURRENCY SWEEP (pp2048/tg512, --warmup-runs 3, acceptance pooled from
  # SpecDecoding metrics over each phase). This was run to check what dropping
  # the ladder gives up at high batch. Answer: nothing.
  #
  #    c   accept    len   steps/s   t/s tot   t/s req    %bw    ttft
  #    1    39.6%   3.377    4.00     13.51     13.51    49.1%    1.4s
  #    2    41.3%   3.479    4.36     30.34     15.98    53.5%    3.1s
  #    4    36.8%   3.209    3.73     47.85     13.55    45.7%    8.4s
  #    6    38.4%   3.303    3.35     66.45     13.45    41.1%   12.3s
  #    8    38.5%   3.309    3.08     81.44     12.35    37.7%   16.3s
  #
  # Acceptance is FLAT with batch size (36.8-41.3%, no trend). The ladder
  # tapered drafts on the premise that deep speculation stops paying as batch
  # grows; acceptance says that premise is wrong. The step rate does fall 23%
  # from c1 to c8 as the verify pass turns compute-bound (49% -> 38% of Spark's
  # 273 GB/s), so the mechanism is real — it just is not worth tapering for:
  #
  #   the ladder would draft 2 at c7-8, giving ~2.29 accepted tokens per seq per
  #   step against 3.31 at depth 6 — 31% fewer tokens per step. Step time rises
  #   only 30% across the whole range from 7 verify tokens (c1) to 56 (c8), so
  #   cutting verify to 24 tokens cannot recover 31%. Flat 6 wins at every level.
  #
  # Per-request throughput barely moves (13.51 -> 12.35, -9%) while aggregate
  # scales 6.0x. The cost of load is TTFT, not throughput: 1.4s -> 16.3s,
  # because 8 x 2048 = 16,384 prompt tokens hit max_num_batched_tokens 8192 and
  # every prefill gets chunked while competing with decode ("Running: 4 reqs,
  # Waiting: 4 reqs" throughout the c8 phase; aggregate prefill sags 1476 ->
  # 893 t/s). Raise max_num_batched_tokens before touching drafting depth if
  # interactive latency under load ever matters.
  speculative_config: '{"method":"mtp","num_speculative_tokens":6}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  # DO NOT re-add VLLM_USE_V2_MODEL_RUNNER=1 on vllm d9fbe526c
  # (0.26.1rc1.dev1188). It is the documented way to keep full CUDA graphs under
  # a dynamic verify length, and it does engage — "Using V2 Model Runner",
  # cudagraph_mode FULL_AND_PIECEWISE — then dies in speculator graph capture on
  # the 2nd of 15 decode graphs:
  #   gpu/spec_decode/autoregressive/speculator.py:189 capture()
  #   -> gpu/input_batch.py:123  assert 0 < num_reqs <= num_tokens
  # Logged immediately before: "Fused multi-step draft decode is not supported
  # by attention backend(s) FLASHINFER; falling back to rebuilding attention
  # metadata between draft steps." Root cause not isolated — could be the
  # dynamic verify length, could be that FlashInfer fallback. Both Inkling
  # recipes run V2 fine; neither uses speculative decoding.

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      -tp {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --load-format {load_format} \
      --limit-mm-per-prompt '{limit_mm_per_prompt}' \
      --speculative-config '{speculative_config}' \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-auto-tool-choice \
      --tool-call-parser {tool_call_parser} \
      --reasoning-parser {reasoning_parser} \
      --default-chat-template-kwargs '{default_chat_template_kwargs}'

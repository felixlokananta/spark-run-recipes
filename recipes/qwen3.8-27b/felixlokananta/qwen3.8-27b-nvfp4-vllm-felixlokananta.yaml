recipe_version: "2"
# Qwen3.8-27B — NVFP4, single DGX Spark node. Start here.
# ~23 GB of weights, native to GB10 Blackwell. This is a dense 27B hybrid
# vision-language model: 64 decoder layers, of which only every 4th is full
# attention; the other 48 are Gated DeltaNet linear attention. The checkpoint
# ships the vision tower AND the MTP draft head, so it runs multimodal and with
# speculative decoding out of one repo.
model: unsloth/Qwen3.8-27B-NVFP4
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

min_nodes: 1
max_nodes: 1

metadata:
  description: "Qwen3.8-27B NVFP4 — dense 27B hybrid-attention VLM, 262K context, MTP speculative decoding, single node."
  maintainer: "felixlokananta"
  category: general
  model_params: 27B
  model_dtype: nvfp4
  quantization: compressed-tensors
  quant_bits: 4
  kv_dtype: fp8
  # config.json sets full_attention_interval: 4 over num_hidden_layers: 64, so
  # only 16 layers feed the paged KV cache. The other 48 hold a constant-size
  # recurrent state per sequence instead — see the README on max_num_seqs.
  num_layers: 16
  num_kv_heads: 4
  head_dim: 256

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.70
  max_model_len: 262144
  max_num_batched_tokens: 8192
  # Each concurrent sequence pins ~151 MB of fp32 Gated DeltaNet state on top of
  # its KV pages. 8 is the point where that stays under ~1.2 GB.
  max_num_seqs: 8
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  load_format: fastsafetensors
  served_model_name: qwen3.8-27b
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  # The template defaults to reasoning_effort xhigh, which is a lot of thinking
  # tokens at Spark decode speeds. medium is the usable default; see the README.
  default_chat_template_kwargs: '{"reasoning_effort":"medium"}'
  limit_mm_per_prompt: '{"image":4,"video":1}'
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  FLASHINFER_DISABLE_VERSION_CHECK: "1"

command: |
  vllm serve {model} \
      --served-model-name {served_model_name} \
      --host {host} \
      --port {port} \
      -tp {tensor_parallel} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --max-model-len {max_model_len} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --max-num-seqs {max_num_seqs} \
      --kv-cache-dtype {kv_cache_dtype} \
      --attention-backend {attention_backend} \
      --load-format {load_format} \
      --limit-mm-per-prompt '{limit_mm_per_prompt}' \
      --speculative-config '{speculative_config}' \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-auto-tool-choice \
      --tool-call-parser {tool_call_parser} \
      --reasoning-parser {reasoning_parser} \
      --default-chat-template-kwargs '{default_chat_template_kwargs}'
